org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=false
android.useAndroidX=true
# R8 compatibility (ProGuard-semantics) mode: more forgiving of reflective library code than
# full mode, which cannot be exercised for the bundled ML Kit pipeline without a device.
android.enableR8.fullMode=false

[global]
server role = standalone server
workgroup = WORKGROUP
security = user
map to guest = Never
interfaces = 127.0.0.1
bind interfaces only = yes
smb ports = 2445
server min protocol = SMB2
server max protocol = SMB3
disable netbios = yes
dns proxy = no
load printers = no
printing = bsd
printcap name = /dev/null
log file = /tmp/manga-reader-smb-fixture/log.%m
pid directory = /tmp/manga-reader-smb-fixture
lock directory = /tmp/manga-reader-smb-fixture/lock
state directory = /tmp/manga-reader-smb-fixture/state
cache directory = /tmp/manga-reader-smb-fixture/cache
private dir = /tmp/manga-reader-smb-fixture/private
ncalrpc dir = /tmp/manga-reader-smb-fixture/ncalrpc
passdb backend = smbpasswd:/tmp/manga-reader-smb-fixture/private/smbpasswd

[manga]
path = /tmp/manga-reader-smb-fixture/share
read only = yes
browseable = yes
guest ok = no
valid users = jack

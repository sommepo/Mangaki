[package]
name = "fork-api-host-tests"
description = "Compiles the Android fork API on the development host so its unit and loopback integration tests can run without a device."
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

# Keep these in step with bin/manatan_android/Cargo.toml.
[dependencies]
axum.workspace = true
base64.workspace = true
chrono = { version = "0.4", features = ["clock", "serde"] }
futures = "0.3"
image.workspace = true
jni = "0.21"
manatan-ocr-server.workspace = true
manga-reader-core.workspace = true
ndk-context = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
reqwest_dav = "0.3.3"
serde.workspace = true
serde_json = "1.0"
smb2 = "0.18"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
zip.workspace = true
